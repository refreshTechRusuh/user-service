name: Build & Deploy to Cloud Run

# PR ke main  -> test + build + push image (tanpa deploy)
# Push ke main -> test + build + push + deploy ke Cloud Run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: user-service
  AR_HOST: asia-southeast2-docker.pkg.dev
  IMAGE: asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rusuh/user-service

permissions:
  contents: read
  id-token: write   # diperlukan untuk Workload Identity Federation

jobs:
  build-and-deploy:
    name: Test, Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & unit test
        run: |
          go vet ./...
          go test ./...

      # Gagal cepat bila GitHub Variable belum diisi (env kosong -> app jatuh ke
      # default lokal seperti DB_HOST=localhost dan crash di Cloud Run).
      - name: Check required GitHub Variables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          APP_PORT: ${{ vars.APP_PORT }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          REDIS_ADDR: ${{ vars.REDIS_ADDR }}
          DUKCAPIL_BASE_URL: ${{ vars.DUKCAPIL_BASE_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: |
          for k in APP_ENV APP_PORT DB_HOST DB_NAME REDIS_ADDR DUKCAPIL_BASE_URL ADMIN_EMAIL; do
            [ -n "${!k}" ] || { echo "::error::GitHub Variable $k kosong"; exit 1; }
          done

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Env non-rahasia dari GitHub Variables; secret dari Secret Manager
      # (hanya NAMA secret yang ada di sini, nilainya tidak pernah ke GitHub).
      # Setting infra (VPC connector, akses publik, min/max instance) diset sekali
      # oleh deploy/gcp/08_be1_deploy_cloudrun.sh dan tidak diubah di sini.
      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            APP_ENV=${{ vars.APP_ENV }}
            APP_PORT=${{ vars.APP_PORT }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            LOG_FORMAT=${{ vars.LOG_FORMAT }}
            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_USER=${{ vars.DB_USER }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_SSL_MODE=${{ vars.DB_SSL_MODE }}
            DB_MAX_OPEN_CONNS=${{ vars.DB_MAX_OPEN_CONNS }}
            DB_MAX_IDLE_CONNS=${{ vars.DB_MAX_IDLE_CONNS }}
            DB_CONN_TIMEOUT_SECONDS=${{ vars.DB_CONN_TIMEOUT_SECONDS }}
            REDIS_ADDR=${{ vars.REDIS_ADDR }}
            REDIS_DB=${{ vars.REDIS_DB }}
            USER_JWT_TTL_SECONDS=${{ vars.USER_JWT_TTL_SECONDS }}
            REFRESH_TOKEN_TTL_SECONDS=${{ vars.REFRESH_TOKEN_TTL_SECONDS }}
            DUKCAPIL_BASE_URL=${{ vars.DUKCAPIL_BASE_URL }}
            DUKCAPIL_TIMEOUT_SECONDS=${{ vars.DUKCAPIL_TIMEOUT_SECONDS }}
            ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
          secrets: |
            DB_PASSWORD=db-password:latest
            REDIS_PASSWORD=redis-password:latest
            USER_JWT_SECRET=user-jwt-secret:latest
            REFRESH_TOKEN_SECRET=refresh-token-secret:latest
            ADMIN_PASSWORD=admin-password:latest
          flags: --no-traffic

      - name: Route traffic to new revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
